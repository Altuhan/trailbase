name: 'Setup Build'
description: 'Sets up the build/test environment on Ubuntu'
# inputs:
#   who-to-greet:  # id of input
#     description: 'Who to greet'
#     required: true
#     default: 'World'
# outputs:
#   random-number:
#     description: "Random number"
#     value: ${{ steps.random-number-generator.outputs.random-number }}
runs:
  using: "composite"
  steps:
    - name: Inspect Checkout
      shell: bash
      # --always: don't fail on tag-less checkouts (e.g. forks, which GitHub
      # creates without copying tags); the binary's version stamping already
      # falls back gracefully when no tag is reachable.
      run: git describe --tags --always

    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends curl libssl-dev pkg-config libclang-dev protobuf-compiler libprotobuf-dev libgeos-dev

    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: PNPM install dependencies
      shell: bash
      run: |
        pnpm install

    # NOTE: actions-rs/toolchain is archived and declares a Node runtime that
    # GitHub runners no longer support.
    - uses: dtolnay/rust-toolchain@1.95.0
      with:
        components: rustfmt, clippy

    - name: Install fake sendmail
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/fakebin"
        cat > "$RUNNER_TEMP/fakebin/sendmail" <<'EOF'
        #!/usr/bin/env bash
        cat >/dev/null
        exit 0
        EOF
        chmod +x "$RUNNER_TEMP/fakebin/sendmail"
        echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
