name: test

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:

  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # No shallow checkout, i.e. fetch all tags (used for versioning the binary).
          fetch-depth: 0

      - id: free_disk
        uses: ./.github/actions/free_disk

      - id: setup_build
        uses: ./.github/actions/setup_build

      - name: "Build With All Features"
        env:
          RUST_BACKTRACE: 1
        run: cargo build --all-features

      # Just to monitor the runner's disk consumption.
      - name: Monitor Disk Space (End)
        run: df -h

  build-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # No shallow checkout, i.e. fetch all tags (used for versioning the binary).
          fetch-depth: 0

      - id: free_disk
        uses: ./.github/actions/free_disk

      - id: setup_build
        uses: ./.github/actions/setup_build

      - name: "Build With Minimal Features"
        env:
          RUST_BACKTRACE: 1
        run: cargo build --all-targets --no-default-features

      # Just to monitor the runner's disk consumption.
      - name: Monitor Disk Space (End)
        run: df -h

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # No shallow checkout, i.e. fetch all tags (used for versioning the binary).
          fetch-depth: 0

      - id: free_disk
        uses: ./.github/actions/free_disk

      - id: setup_build
        uses: ./.github/actions/setup_build
      - id: setup_clients
        uses: ./.github/actions/setup_clients

      - name: "Build & Run Tests"
        uses: pre-commit/action@v3.0.1
        env:
          RUST_BACKTRACE: 1
        with:
          extra_args: "--all-files --verbose"

      # Just to monitor the runner's disk consumption.
      - name: Monitor Disk Space (End)
        run: df -h

  test-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # No shallow checkout, i.e. fetch all tags (used for versioning the binary).
          fetch-depth: 0

      - id: free_disk
        uses: ./.github/actions/free_disk

      - id: setup_build
        uses: ./.github/actions/setup_build

      - name: "Test Rust Client"
        env:
          RUST_BACKTRACE: 1
        run: cd crates/client && cargo test --features=ws
      - name: "Test TypeScript Client"
        env:
          USE_WS: 1
        run: cd crates/assets/js/client && pnpm test

      # Just to monitor the runner's disk consumption.
      - name: Monitor Disk Space (End)
        run: df -h

  test-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # No shallow checkout, i.e. fetch all tags (used for versioning the binary).
          fetch-depth: 0

      - id: free_disk
        uses: ./.github/actions/free_disk

      - id: setup_build
        uses: ./.github/actions/setup_build

      - name: "Build & Run Tests"
        env:
          RUST_BACKTRACE: 1
        # Scope to the crates with pg code paths. The client integration test
        # (which spawns its own `cargo run` server build) already runs in the
        # `test` and `test-websocket` jobs and only bloats this one.
        # Serial test threads: the embedded-PGlite tests hang under the
        # default parallel execution but pass reliably single-threaded.
        run: |
          cargo test -p trailbase --features=geos,otel,pg-test -- --test-threads=1
          cargo test -p trailbase-sqlite --features=generic -- --test-threads=1

      # Just to monitor the runner's disk consumption.
      - name: Monitor Disk Space (End)
        run: df -h

  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # No shallow checkout, i.e. fetch all tags (used for versioning the binary).
          fetch-depth: 0

      - id: free_disk
        uses: ./.github/actions/free_disk

      - id: setup_build
        uses: ./.github/actions/setup_build

      - name: "Unit Tests"
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p trailbase-mcp

      - name: "Build trail"
        env:
          RUST_BACKTRACE: 1
        run: cargo build -p trailbase-cli

      - name: "MCP end-to-end (stdio + streamable http)"
        run: crates/mcp/tests/ci-e2e.sh target/debug/trail

      - name: "TypeScript MCP server tests"
        run: pnpm -C examples/mcp-server test

      # Just to monitor the runner's disk consumption.
      - name: Monitor Disk Space (End)
        run: df -h
